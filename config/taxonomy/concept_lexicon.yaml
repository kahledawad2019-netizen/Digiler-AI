# =============================================================================
# Domain concept lexicon (Stage 10.5 — concept-extraction quality upgrade).
# Curated canonical concepts for the corpus's real domains, each with aliases +
# acronym expansions. This is the high-precision backbone of concept extraction
# (V3 §4.3: seed + human curation firewall). The ConceptExtractor matches these
# against the corpus text and enriches them with embedding-mined multi-word
# phrases; generic terms (data, example, result, chapter, …) never appear.
#
#   id       : slug used in concept ids (concept:<id>)
#   canonical: display name
#   aliases  : surface forms found in text (incl. acronyms, plurals, variants)
#   domain   : grouping for reports/coloring
# =============================================================================

