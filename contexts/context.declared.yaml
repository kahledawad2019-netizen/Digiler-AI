# =============================================================================
# ALA — Declared self-knowledge (input to the Project Context, Task 5)
# -----------------------------------------------------------------------------
# The parts of the platform's self-description that a human declares (component
# roster + statuses, model choices, subsystem statuses). The ProjectContext
# service MERGES this with LIVE state read from the catalog + taxonomy to produce
# contexts/project_context.yaml. Update a component's status here (one line) as
# milestones land — no code change.
#
# status ∈ {planned, in_progress, implemented, deferred}
# =============================================================================

configuration:
  vector_store: "Qdrant (local mode; supersedes ChromaDB per current directive)"
  vector_store_status: implemented
  embedding_model: "intfloat/multilingual-e5-small"   # bge-m3 = higher tier (V3)
  embedding_status: implemented
  llm: "Qwen2.5 (tiered)"
  llm_status: planned
  retrieval_strategy: "hybrid: dense + BM25 + concept-graph, fused with RRF (V3 §5)"
  graph_status: implemented
  student_model_status: implemented
  reinforcement_learning_status: implemented
  evaluation_status: planned

