# Nginx reverse proxy — serves the Next.js frontend and proxies /api (+ SSE streaming).
upstream digiler_backend { server backend:8000; }
upstream digiler_frontend { server frontend:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://digiler_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events (chat streaming): disable buffering, long read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /docs { proxy_pass http://digiler_backend; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://digiler_backend; proxy_set_header Host $host; }

    # Frontend (Next.js). Everything not matched above is served by the web app.
    location / {
        proxy_pass http://digiler_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev/HMR + streaming responses.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
