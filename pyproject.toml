[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ala-platform"
version = "0.1.0"
description = "AI Learning Platform (ALA) — Knowledge Base infrastructure and beyond. Architecture V3 baseline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — Digilians educational use" }
authors = [{ name = "ALA Engineering" }]

# Core dependencies are deliberately minimal (local-first, avoid unnecessary deps).
#   pydantic  -> typed, self-validating metadata schema (Task 2).
#   pyyaml    -> human-editable configuration & taxonomy (config-over-hardcode).
# SQLite (catalog) and hashlib (change detection) are in the standard library.
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "numpy>=1.26",          # vectors, benchmark math (embedding stage)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Ingestion loaders.
ingestion = [
    "pypdf>=4.0",
    "python-pptx>=0.6",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "nbformat>=5.9",
]
# Transformer embedding models (Stage 4). The hashing embedder works without this.
models = [
    "sentence-transformers>=3.0",
]
# Benchmark visualizations (Stage 4): PCA/t-SNE/heatmaps. UMAP is optional.
viz = [
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]
# Qdrant vector store (Stage 5). Local mode = no server; server-ready via URL.
vectorstore = [
    "qdrant-client>=1.10",
]

[project.scripts]
ala = "ala.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ala = ["catalog/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ala]
# Pointer used by ala.config.settings to locate the runtime config when the
# environment variable ALA_CONFIG is not set.
default_config = "config/platform.yaml"
